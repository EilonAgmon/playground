<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Travel — Eilon Agmon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="loginScreen" class="screen">
    <h1 class="glow">✈️ TRAVEL</h1>
    <form id="loginForm">
      <input
        type="text"
        id="username"
        placeholder="your name"
        maxlength="20"
        autocomplete="off"
        autofocus
      />
      <button type="submit">enter</button>
    </form>
    <p id="loginError" class="error hidden">enter a name first</p>
    <p class="back"><a href="../">&larr; back to the portal</a></p>
  </div>

  <div id="homeScreen" class="screen hidden">
    <h1 class="glow">✈️ TRAVEL</h1>
    <p id="welcome" class="welcome"></p>
    <p class="hint">coming soon</p>
    <p class="back">
      <a href="../">&larr; back to the portal</a>
      &nbsp;·&nbsp;
      <a href="#" id="switchUser">not you?</a>
    </p>
  </div>

  <script src="app.js"></script>
</body>
</html>
