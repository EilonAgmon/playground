<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Eilon Agmon</title>
  <meta name="description" content="Eilon Agmon's personal site." />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="portal">
    <h1 class="glow">EILON AGMON</h1>
    <p class="tagline">pick an app</p>

    <div class="grid">
      <a class="tile" href="pong/">
        <svg class="icon pixel-icon" viewBox="0 0 12 8" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="1" y="2" width="1" height="4" fill="currentColor"/>
          <rect x="10" y="2" width="1" height="4" fill="currentColor"/>
          <rect x="4" y="3" width="2" height="2" fill="currentColor"/>
          <rect x="6" y="0" width="1" height="1" fill="currentColor" opacity="0.5"/>
          <rect x="6" y="6" width="1" height="1" fill="currentColor" opacity="0.5"/>
        </svg>
        <span class="label">Pong</span>
      </a>
      <a class="tile" href="travel/">
        <svg class="icon pixel-icon" viewBox="0 0 12 10" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="4" y="0" width="3" height="2" fill="currentColor"/>
          <rect x="1" y="2" width="10" height="8" fill="currentColor"/>
          <rect x="1" y="5" width="10" height="1" fill="#000"/>
        </svg>
        <span class="label">Travel</span>
      </a>
    </div>

    <footer id="identity">
      <a href="https://github.com/EilonAgmon" target="_blank" rel="noopener">github.com/EilonAgmon</a>
    </footer>
  </main>
</body>
</html>
